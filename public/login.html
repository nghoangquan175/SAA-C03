<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SAA-C03 Practice</title>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23161c26'/><path d='M14 40c10 7 26 7 36 0' stroke='%23ff9900' stroke-width='5' fill='none' stroke-linecap='round'/><path d='M44 36l7 3-3 7' stroke='%23ff9900' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='32' y='31' font-family='Arial' font-weight='700' font-size='17' fill='%23e6edf3' text-anchor='middle'>SAA</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="login-page">
    <div class="card pad-lg login-card">
      <div class="brand">
        <span class="brand-mark">SAA</span>
        <span class="brand-text">Solutions Architect <b>Associate</b></span>
      </div>
      <h1>Sign in</h1>
      <p class="lead">This practice site is private.</p>
      <form id="loginForm" novalidate>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <label class="field">Username
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">Password
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary lg" type="submit" id="submitBtn">Sign in</button>
      </form>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
